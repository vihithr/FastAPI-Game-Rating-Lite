{% extends "base.html" %}

{% block title %}重置密码 - STG社区评价{% endblock %}

{% block content %}
<article class="auth-card">
    <header>
        <span class="auth-icon"><i data-lucide="lock"></i></span>
        <h2>重置密码</h2>
    </header>

    {% if error_message %}
        <div class="form-alert" role="alert">{{ error_message }}</div>
    {% endif %}

    <form action="/password-reset" method="post">
        <input type="hidden" name="token" value="{{ token }}">
        <label for="new_password">
            新密码
            <input type="password" id="new_password" name="new_password" minlength="8" maxlength="128" required>
        </label>
        <label for="confirm_password">
            确认新密码
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" maxlength="128" required>
        </label>
        <button type="submit">提交</button>
    </form>

    <footer>
        <a href="/login">返回登录</a>
    </footer>
</article>
{% endblock %}
